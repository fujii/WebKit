# Headless Weston for MotionMark. The headless backend finishes a frame 16 ms after repaint (hard-coded), and Weston
# starts the repaint refresh - repaint-window ms after the previous frame. With the default 7 ms window that is a
# 25.7 ms (39 fps) cycle, which broke MotionMark (Design 2.00, 1.00 scores, hangs). 16 ms gives ~17.1 ms (58.5 fps).
[core]
repaint-window=16
